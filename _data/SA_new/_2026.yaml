lectures:
- date: 2026/09/08
  slides:
  - title: "课程介绍"
    link: slides01_intro.pdf
  assignment:
    descriptions:
    - text: 假设我们设计一个程序分析来检测程序是否会抛出异常。该分析遍历输入空间中每一个输入，然后执行100条语句，看程序是否抛出异常。对于有限输入空间的程序，该分析是精确分析、上近似、下近似还是不属于以上三类？为什么？
    - text: 假设我们把符号分析的抽象域改成{自然数，负，槑}三个值，其中自然数表示所有正数和零，请写出加法和乘法的计算规则，并给出一个式子，在该抽象域上得到的结果不如{正，负，零，槑}精确。
    due: 2026/09/22 上课前

