lectures:
- date: 2026/09/08
  slides:
  - title: "课程介绍"
    link: slides01_intro.pdf
  assignment:
    descriptions:
    - text: 假设我们设计一个程序分析来检测程序是否会抛出异常。该分析遍历输入空间中每一个输入，然后执行100条语句，看程序是否抛出异常。对于有限输入空间的程序，该分析是精确分析、上近似、下近似还是不属于以上三类？为什么？
    - text: 假设我们把符号分析的抽象域改成{自然数，负，槑}三个值，其中自然数表示所有正数和零，请写出加法和乘法的计算规则，并给出一个式子，在该抽象域上得到的结果不如{正，负，零，槑}精确。
    due: 2026/09/22 上课前

- date: 2026/09/15
  slides:
  - title: "程序设计语言基础知识"
    link: slides02_basics.pdf
  assignment:
    descriptions:
    - text: 课件中给出的 IMP 程序控制流图构建算法还有两个问题：（1）对于判断结点，出边没有区分是 true 还是 false；（2）对于基本块中的语句没有进行合并。请针对上面两个问题修改算法。注意可能既需要修改 f 函数的定义，也需要修改表示控制流图的数据结构。
    due: 2026/09/22 上课前

- date: 2026/09/17
  slides:
  - title: "数据流分析：示例"
    link: slides03_dataflow_analysis_I.pdf
  assignment:
    descriptions:
    - text: |
        <strong>繁忙表达式分析（very busy expression）</strong>
        <p>繁忙表达式：从执行某个程序节点之前开始，在其中变量被修改之前，在所有终止执行中一定会被读取的表达式。如果从某个程序点开始的所有执行都不终止，则可返回任意结果。</p>
        <p>繁忙表达式分析：找到每个程序节点的繁忙表达式，要求下近似。例如：</p>
        <pre><code>1. if (a &gt; b)
        2.   x=b-a
        3.   y=x-y+(a+b+b)
        4. else
        5.   y=b-a
        6. x=x-y+(a+b)</code></pre>
        <p>在第一行，<code>b-a</code>、<code>a+b</code>、<code>a&gt;b</code> 为繁忙表达式。</p>
        <p>请设计繁忙表达式分析。请给出分析方向、抽象域设计（抽象值集合、γ、初值）、转换函数、合并操作，并简要讨论正确性。</p>
    due: 2026/09/29 上课前

- date: 2026/09/22
  slides:
  - title: "数据流分析：框架和扩展"
    link: slides04_dataflow_analysis_II.pdf
  assignment:
    descriptions:
    - text: |
        <p>整数采用区间抽象，布尔值采用 {⊥, 真, 假, 值}。整数是数学定义，无上下界；区间抽象 [a, b] 表示大于等于 a、小于等于 b 的整数集合，其中 a 和 b 为任意整数。</p>
        <p>请针对逻辑与、逻辑非、大于、加法这四种操作，设计参考输入的反向抽象语义，要求尽可能精确。</p>
        <p>同时分析：基于你设计的反向语义，对任意表达式是否能保证收敛。表达式中可包含变量、常量和以上四种操作符。</p>
    due: 2026/09/29 上课前

- date: 2026/09/29
  slides:
  - title: "加宽变窄"
    link: slides05_dataflow_analysis_III.pdf
  assignment:
    descriptions:
    - text: |
        <p>对于下面程序，如果我们在条件分支的地方加上节点根据条件压缩抽象值，采用今天课上讲的加宽算子进行区间分析，每条语句对应的 OUT 值是什么？如果加上变窄，对应的 OUT 值是什么？</p>
        <pre><code>1. x=1;
        2. while (x &lt; 100) {
        3.   x++;}
        4. skip;</code></pre>
    due: 2026/10/13 上课前

- date: 2026/10/13
  slides:
  - title: "抽象解释和其他模型"
    link: slides06_dataflow_analysis_IV.pdf

- date: 2026/10/15
  slides:
  - title: "抽象解释和其他模型（续）"
    link: slides06_dataflow_analysis_IV.pdf
  assignment:
    descriptions:
    - text: |
        <p>一个用 Datalog 编写的符号分析，在应用到下面程序上时，产生了一部分规则，请补全剩余的规则，并分析相比之前的符号分析，精度是否一样？如果不一样，请举一个例子。分析规则和结果中不出现槑和 ⊥。</p>
        <pre><code>1. x-=1;
        2. y+=1;
        3. while(y &lt; z) {
        4.   x *= -100;
        5.   y += 1;}</code></pre>
        <p>输入：x 为负，y 为零，z 为正。求输出的符号。</p>
        <pre><code>out(x, entry, 负)
        out(y, entry, 零)
        out(z, entry, 正)
        out(x, exit, ?)
        out(y, exit, ?)
        out(z, exit, ?)
        edge(1, 2), edge(2, 3), edge(5, 3), edge(3, 4),
        edge(4, 5), edge(entry, 1), edge(3, exit)
        out(x, 1, 正) :- in(x, 1, 正)
        out(x, 1, 零) :- in(x, 1, 正)
        out(x, 1, 负) :- in(x, 1, 负)
        out(x, 1, 负) :- in(x, 1, 零)
        out(v, 3, 甲) :- in(v, 3, 甲)</code></pre>
    - text: 注：只是将如上程序手动转换成 Datalog 规则，不用编写针对任意程序通用的分析。
      note: true
    due: 2026/10/20 上课前

- date: 2026/10/20
  slides:
  - title: "过程间分析"
    link: slides07_interprocedural_analysis_basics.pdf
  assignment:
    descriptions:
    - text: |
        <strong>过程间可达定值分析</strong>
        <p>设计一个过程间的可达定值分析。给出半格定义和变换函数定义，特别是 <code>call</code> 语句和 <code>return</code> 语句的变换函数。</p>
        <p>参数传递不认为是定值。例如，下面程序中，标号 2 位置的 <code>c</code> 是由标号 1 的语句定值的，而不是标号 3 的语句定值的。</p>
        <pre><code>void main() {
          int a = 100; //1
          b(a) //3
        }
        void b(int c) {
          print(c); //2
        }</code></pre>
        <p>假设过程调用时不能传表达式，只能传变量，即 <code>f(a+b)</code> 不合法，<code>f(a)</code> 合法。</p>
        <p>根据上述定义的可达定值分析，采用基于克隆的方法分析下面的程序，<code>k</code> 至少应该设置成多少，分析结果才能和精确的上下文敏感分析等价？</p>
        <pre><code>int g;
        void main() {
          int a = 10;
          g = a + 1;
          h(a); h(a);
        }
        void h(int a) {
          x(a); g++; x(a);
        }
        void x(int a) {
          output(a);
        }</code></pre>
    - text: |
        <strong>符号分析与 CFL 可达性</strong>
        <p>对下面的程序做符号分析，抽象域参考下方绘图基础，考虑条件压缩函数，画出 CFL-reachability 的图。要求根据输入值 <code>x</code> 的符号，在这个程序上能分析出返回值完全精确的符号结果。</p>
        <p>一般性的符号分析无法转为 CFL 可达性，但本程序只涉及一元操作，所以可以用 CFL 可达性分析。</p>
        <pre><code>int main() {
          ...
          assert(y &gt; 0 &amp;&amp; z &lt; 0);
          f(y); f(z);
        }
        int f(int x) {
          if (x &lt; 0) {
            x = x + 1;
            if (x == 0) x = 2025;
            else x = f(x);
          }
          else if (x &gt; 0) {
            x = x - 1;
            if (x == 0) x = -2025;
            else x = f(x);
          }
          else x = 0;
          return x;
        }</code></pre>
        <p>假设 <code>int</code> 是无界整数，分析是否存在一个足够大的 <code>k</code>，使得基于克隆的方法在 <code>f</code> 的最后一行返回精确的结果。如果存在，请给出这样的 <code>k</code>；如果不存在，请给出简要证明。请针对“调用位置作为上下文”和“函数名称作为上下文”两种情况分别分析。</p>
        <p><img src="images/assignment07-cfl-base.png" alt="符号分析的绘图基础：x、y、z 的符号节点及程序控制流" width="1440" height="1080" style="height: auto;" loading="lazy"></p>
        <p>图中每组三个节点从左到右依次表示 &lt;0、=0、&gt;0 的情况；蓝、紫、绿分别表示 <code>x</code>、<code>y</code>、<code>z</code>。浅灰色边仅表示控制流，不表示 CFL-reachability 图中的任何边；为使图更清晰，图中省略了部分节点和边。</p>
    - text: 原图中的常数 2024 和 -2024 分别按上面程序中的 2025 和 -2025 读取。
      note: true
    due: 2026/10/27 上课前

