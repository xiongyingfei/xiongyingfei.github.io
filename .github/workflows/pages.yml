name: Publish homepage and original courses
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check publishing-source freshness approval
        run: python -c "import json; assert json.load(open('.site-support/ownership.json'))['source_verified_remote'], 'Offline preparation cannot deploy'"
      - uses: actions/configure-pages@v5
      - name: Build courses with their original Jekyll layouts
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Allow the runner to maintain the generated site
        # The Jekyll Docker action writes as root. Change ownership only of
        # its output; leave the checkout and TA-owned source files untouched.
        run: sudo chown -R --no-dereference "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/_site"
      - name: Apply course retention after Jekyll, and verify protected assets
        run: |
          python -m pip install PyYAML
          python .site-support/finalize_pages.py --source . --site _site --support .site-support
          python .site-support/check_site.py --dist _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Save retention report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publishing-report
          path: .site-support/reports/publishing.json
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
