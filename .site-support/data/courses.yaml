  extra:
    en: <a href="https://liveclass.org.cn/cloudCourse/#/courseDetail/8mI06L2eRqk8GcsW">Course
      Video of 2020</a>
    zh: <a href="https://liveclass.org.cn/cloudCourse/#/courseDetail/8mI06L2eRqk8GcsW">2020年课程录像</a>
  description:
    zh: '对软件代码进行分析是各种软件工程工具的基本手段之一。典型软件开发工具比如编译器、代码编辑器、测试与调试工具等等都离不开对软件代码进行分析。在工业界，各大公司的基础平台部门对掌握软件分析技术的人才有大量需求；在学术界，软件分析技术是程序设计语言和软件工程领域开展研究的必备基础知识之一。但是，软件分析技术相关文献存在内容广，流派多，数学基础要求高等方面的特点，使得学习软件分析技术一直是一件很困难的事。本课程希望通过对这一类技术进行通俗易懂的讲解，帮助同学们构建较完整的软件分析技术知识体系，了解该领域的前沿知识，学术上为进一步开展程序设计语言和软件工程领域的学术研究打下基础，在实践上培养开发大型软件工程工具的开发能力。

      '
SF:
  name:
    zh: 软件科学基础（原：软件理论基础与实践）
    en: Software Foundations
  offerings:
